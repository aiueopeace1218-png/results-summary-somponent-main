<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Results summary component solution</title>
        <link rel="stylesheet" href="style.css">

    </head>

    <body>
        <main>
        <div class="result-card">
            <h1>Your Results</h1>
            <div class="score-display">
            <div class="score">76</div>
            <div class="total">of 100</div>
            </div>

            <h2>Great</h2>

            <p>You scored higher than 65% of the people who have taken these tests.</p>
        
        </div>

        <div class="summary-card">
            <h1>Summary</h1>

            <div class="category-item reaction">
                <img src="assets/images/icon-reaction.svg" alt="Reaction">
                <div class="category-name">Reaction</div>
                <div class="category-score">
                    <span class="score-number">80</span>
                    <span class="score-total">/100</span></div>
            </div>

            <div class="category-item memory">
                <img src="assets/images/icon-memory.svg" alt="Memory">
                <div class="category-name">Memory</div>
                <div class="category-score">
                    <span class="score-number">92</span>
                    <span class="score-total">/100</span></div>
            </div>

            <div class="category-item verbal">
                <img src="assets/images/icon-verbal.svg" alt="Verbal">
                <div class="category-name">Verbal</div>
                <div class="category-score">
                <span class="score-number">61</span>
                <span class="score-total">/100</span></div>
            </div>

            <div class="category-item visual">
                <img src="assets/images/icon-visual.svg" alt="Visual">
                <div class="category-name">Visual</div>
                <div class="category-score">
                <span class="score-number">61</span>
                <span class="score-total">/100</span></div>
            </div>
            <button class="button">Continue</button>
            
        </main>
        </div>
    </body>
</html>
